<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniShop — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header"></div>

  <div class="container">
    <div class="form-wrap panel">
      <h1>Welcome to MiniShop</h1>
      <p class="sub">Log in or create an account to check out.</p>

      <!-- Two tabs: Login or Create account -->
      <div class="tabs">
        <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
        <button id="tabRegister" onclick="showTab('register')">Create account</button>
      </div>

      <div id="msg"></div>

      <!-- Name field only shows when registering -->
      <div class="field" id="nameField" style="display:none;">
        <label>Full name</label>
        <input id="name" placeholder="Jane Doe" />
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>

      <button class="btn btn-block" id="submitBtn" onclick="submitForm()">Login</button>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
