<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniShop — Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- The top menu is inserted here by common.js -->
  <div id="header"></div>

  <div class="container">
    <section class="hero">
      <span class="pill">✨ Free shipping on orders over $100</span>
      <h1>Tech that fits your life.</h1>
      <p>Premium electronics, handpicked and delivered fast. Browse the collection below and find your next favourite gadget.</p>
    </section>

    <div class="section-head">
      <h2>All Products</h2>
      <span class="muted" id="productCount"></span>
    </div>

    <!-- Product cards are inserted here by index.js -->
    <div class="grid" id="productGrid"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
